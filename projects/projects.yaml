- filename: alpha.kdenlive
  description: Render output with alpha (using sequences).
- filename: audio-mix.kdenlive
  description: Tests a simple mix between two audio clips.
  # Since MLT 7.42.0 audio conversion is losless, hence the comparison
  # fails for lossy outpit of old MLT versions.
  dependencies:
  - name: mlt
    version: ">= 7.42.0"
